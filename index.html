<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voca Master</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6;
      }
      @media print {
        html, body {
          background-color: white;
          margin: 0 !important;
          padding: 0 !important;
        }
        .no-print {
          display: none !important;
        }
        /* Ensure the worksheet is visible and positioned correctly when printing */
        #hidden-worksheet {
            position: static !important;
            display: block !important;
            left: auto !important;
            top: auto !important;
        }
        /* 파란색 한글 해석 등 색상이 인쇄에서 그대로 나오도록 합니다. */
        #hidden-worksheet * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }
        /* 표가 브라우저에 의해 임의로 잘려 다음 장으로 넘어가지 않게 합니다. */
        #hidden-worksheet table,
        #hidden-worksheet tr {
            break-inside: avoid;
            page-break-inside: avoid;
        }
        @page {
          margin: 0; /* Let the HTML padding handle margins */
          size: 297mm 210mm; /* A4 가로 고정 */
        }
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
